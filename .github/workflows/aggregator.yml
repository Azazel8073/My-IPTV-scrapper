name: Run IPTV Scraper Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Initialize and Run Scraper Pipeline
      run: |
        pip install aiohttp
        CLOUDFLARE_ACCOUNT_ID="${{secrets.CLOUDFLARE_ACCOUNT_ID}}" CLOUDFLARE_NAMESPACE_ID="${{secrets.CLOUDFLARE_NAMESPACE_ID}}" CLOUDFLARE_API_TOKEN="${{secrets.CLOUDFLARE_API_TOKEN}}" CF_BASE_API_URL="https://api.cloudflare.com" python scraper.py
